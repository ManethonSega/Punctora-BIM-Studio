[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "punctora-core"
version = "0.3.0a12"
description = "Punctora BIM Studio experimental E57 reconstruction and IFC core"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "ATTRIBUTIONS.md", "third_party/NOTICE_REGISTER.json", "third_party/LICENCE_SOURCES.json", "third_party/licenses/*.txt", "third_party/references/*.txt"]
dependencies = [
  "numpy==2.3.5",
  "scipy==1.17.0",
  "opencv-python-headless==4.11.0.86",
  "shapely==2.1.2",
  "ifcopenshell==0.8.3",
  "pye57==0.4.19",
  "pyquaternion==0.9.9",
  "psutil==7.2.2",
  "threadpoolctl==3.6.0",
  "pyopencl==2026.1.4",
  # IfcOpenShell 0.8.3 EXPRESS validation imports _pytest.assertion at runtime.
  "pytest==8.4.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
gpu = ["pyopencl==2026.1.4"]

[project.scripts]
punctora-core = "punctora_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

