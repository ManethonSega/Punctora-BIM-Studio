name: Reconstruction core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # IfcOpenShell 0.8.3 requires Python <3.13.
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e . -c requirements-core.txt
      - name: Runtime detection and immediate IFC export without test extras
        run: python scripts/verify_worker_runtime.py --output outputs/runtime
      - run: python -m pytest -q
      - name: Generated quality evaluator and frozen-baseline replay
        run: python scripts/verify_quality_evaluator.py --output-dir outputs/quality-generated
      - name: Generated classical recognition and immutable proposal replay
        run: python scripts/verify_recognition_provider.py --output-dir outputs/recognition-generated
      - name: Keep acceptance truth separate from reconstruction changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_quality_changes.py --base "$QUALITY_BASE_SHA"
      - run: python -m punctora_core demo --two-storeys --output-dir outputs/demo
      - run: python -m punctora_core demo --compare-budgets --output-dir outputs/budget-comparison
      - run: python -m punctora_core demo --settings docs/region-growing-settings.json --output-dir outputs/region-demo
      - run: python -m punctora_core.benchmark --cases clean rotated thin_partition --check --output-dir outputs/benchmarks
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        continue-on-error: true
        with:
          name: m2-benchmark-${{ matrix.os }}-py${{ matrix.python }}
          path: outputs/benchmarks/benchmark.json
          retention-days: 7

